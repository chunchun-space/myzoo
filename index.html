<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五月動物園養殖 V21-同步穩定版</title>
    <style>
        :root { --p: #558b2f; --bg: #fdfaf5; --text: #443e39; --accent: #ff7043; --hp-bg: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; }
        .header-banner { width: 100%; padding: 20px; background: #a8e6cf linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%); border-radius: 20px; margin-bottom: 15px; text-align: center; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .perf-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 15px; background: white; border-radius: 15px; overflow: hidden; border: 2px solid #558b2f; }
        .perf-table th { background: #f0f4ef; padding: 5px; }
        .perf-table td { padding: 5px 2px; text-align: center; border-bottom: 1px solid #eee; }
        .summary-box { background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; border: 2px solid #e1e8e1; }
        .dino-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .dino-card { position: relative; background: white; border-radius: 25px; padding: 15px; border: 3px solid var(--p); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        .editable-title { width: 100%; border: none; background: transparent; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--p); border-bottom: 1px dashed #ccc; margin-bottom: 10px; }
        
        /* 數量縮小, 金額放大 */
        .input-row { display: grid; grid-template-columns: 1.2fr 0.6fr 1.8fr; gap: 4px; margin-bottom: 10px; }
        .input-row input { padding: 8px 4px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.85rem; width: 100%; }
        
        button { width: 100%; padding: 12px; border-radius: 15px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; }
        .log-list { margin-top: 10px; height: 130px; overflow-y: auto; font-size: 0.75rem; border-top: 1px solid #eee; }
        .log-list table { width: 100%; border-collapse: collapse; }
        .log-input { border: 1px solid #eee; width: 100%; text-align: center; padding: 2px; }
    </style>
</head>
<body>

<div class="header-banner">
    <h1>五月動物園養殖</h1>
    <p id="status-msg" style="font-size:0.75rem;">⌛ 正在同步雲端資料...</p>
</div>

<table class="perf-table">
    <thead><tr><th>動物</th><th>總食量</th><th>飽食度</th><th>達成</th></tr></thead>
    <tbody id="performanceBody"></tbody>
</table>

<div class="summary-box">
    <div><span>🥩 總食量</span><b id="gRev" style="color: var(--accent);">$0</b></div>
    <div><span>💸 總支出</span><b id="gExp" style="color: #78909c;">$0</b></div>
    <div><span>💖 總飽食度</span><b id="gProfit" style="color: var(--p);">$0</b></div>
</div>

<div id="dinoContainer" class="dino-grid"></div>

<script>
// ⚠️ 已經替換為你提供的 GAS 網址
const GAS_URL = "https://script.google.com/macros/s/AKfycbVqEjy-kykFhD97zxMfWRA4TYf-nHdPy4SY_rpUUyvyoCHv8niiPZqcEd5StSRBBvZ/exec"; 

const defaultDinos = [
    { id: 0, icon: "Rex", name: "新竹巨城", taxRate: 33, rent: 9000 },
    { id: 1, icon: "Whale", name: "桃園新光", taxRate: 33, rent: 0 },
    { id: 2, icon: "Owl", name: "板橋環球", taxRate: 33, rent: 0 },
    { id: 3, icon: "Fish", name: "內湖三總", taxRate: 33, rent: 0 },
    { id: 4, icon: "Dino", name: "日月光B1", taxRate: 33, rent: 0 },
    { id: 5, icon: "Cow", name: "北榮", taxRate: 33, rent: 0 },
    { id: 6, icon: "Lobster", name: "林口A9", taxRate: 33, rent: 0 },
    { id: 7, icon: "Rooster", name: "北投", taxRate: 33, rent: 0 }
];

let counters = JSON.parse(JSON.stringify(defaultDinos)).map(d => ({ ...d, logs: [] }));

async function fetchCloudData() {
    try {
        const response = await fetch(GAS_URL + "?action=read");
        const data = await response.json();
        counters.forEach(c => c.logs = []);
        data.forEach(row => {
            const dino = counters.find(d => d.name.trim() === String(row.name).trim());
            if (dino) {
                let dStr = String(row.date);
                if (dStr.includes('T')) dStr = dStr.split('T')[0].slice(5);
                dino.logs.push({ date: dStr, qty: row.qty, amt: row.amt });
            }
        });
        document.getElementById('status-msg').innerText = "✅ 雲端同步成功";
        render();
    } catch (e) {
        document.getElementById('status-msg').innerText = "⚠️ 目前無雲端資料";
        render();
    }
}

function render() {
    const container = document.getElementById('dinoContainer');
    const perfBody = document.getElementById('performanceBody');
    container.innerHTML = ''; perfBody.innerHTML = '';
    let gRev = 0, gExp = 0, perfData = [];

    counters.forEach(c => {
        const rev = c.logs.reduce((s, l) => s + (Number(l.amt) || 0), 0);
        const qty = c.logs.reduce((s, l) => s + (Number(l.qty) || 0), 0);
        const cost = qty * 55.2;
        const tax = rev * (c.taxRate / 100);
        const profit = rev - tax - cost - (c.rent || 0);
        gRev += rev; gExp += (tax + cost + (c.rent || 0));
        const hpPercent = Math.min(Math.max((profit / 80000) * 100, 0), 100);

        perfData.push({ icon: c.icon, name: c.name, rev, profit, hp: hpPercent });

        const card = document.createElement('div');
        card.className = 'dino-card';
        card.innerHTML = `
            <input class="editable-title" type="text" value="${c.name}" onchange="update(${c.id}, 'name', this.value)">
            <div class="calc-area">
                <div class="calc-row"><span>🥩 總食量:</span><b>$${rev.toLocaleString()}</b></div>
                <div class="calc-row"><span>💖 飽食度:</span><b style="color:var(--p)">$${profit.toLocaleString(undefined,{maximumFractionDigits:0})}</b></div>
            </div>
            <div class="input-row">
                <input type="date" id="date-${c.id}" value="${new Date().toISOString().split('T')[0]}">
                <input type="number" id="qty-${c.id}" placeholder="只">
                <input type="number" id="amt-${c.id}" placeholder="金額" onkeypress="if(event.key==='Enter')addAndSync(${c.id})">
            </div>
            <button onclick="addAndSync(${c.id})">🍖 餵食同步</button>
            <div class="log-list">
                <table>${c.logs.map((l, i) => `<tr>
                    <td><input class="log-input" type="text" value="${l.date}"></td>
                    <td>${l.qty}</td>
                    <td>$${l.amt.toLocaleString()}</td>
                </tr>`).reverse().join('')}</table>
            </div>
        `;
        container.appendChild(card);
    });

    perfData.sort((a,b)=>b.profit-a.profit).forEach(p=>{
        perfBody.innerHTML += `<tr><td>${p.name}</td><td>$${(p.rev/1000).toFixed(1)}k</td><td style="color:var(--p);font-weight:bold">$${(p.profit/1000).toFixed(1)}k</td><td>${p.hp.toFixed(0)}%</td></tr>`;
    });

    document.getElementById('gRev').innerText = '$' + gRev.toLocaleString();
    document.getElementById('gExp').innerText = '$' + gExp.toLocaleString(undefined, {maximumFractionDigits:0});
    document.getElementById('gProfit').innerText = '$' + (gRev - gExp).toLocaleString(undefined, {maximumFractionDigits:0});
    localStorage.setItem('zoo_data_v21', JSON.stringify(counters));
}

async function addAndSync(id) {
    const q = document.getElementById(`qty-${id}`), a = document.getElementById(`amt-${id}`), d = document.getElementById(`date-${id}`);
    if (!a.value) return alert("請輸入金額");
    const log = { date: d.value.slice(5), amt: parseFloat(a.value), qty: parseInt(q.value)||0 };
    const sData = { ...log, name: counters[id].name, fullDate: d.value };
    
    document.getElementById('status-msg').innerText = "⏳ 同步中...";
    try {
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(sData) });
        fetchCloudData(); // 成功後重新抓取雲端資料以確保一致
        q.value = ''; a.value = '';
    } catch (e) { alert("同步失敗"); }
}

fetchCloudData();
</script>
</body>
</html>
