<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五月動物園養殖 V24-數據即時更新版</title>
    <style>
        :root { --p: #558b2f; --bg: #fdfaf5; --text: #443e39; --accent: #ff7043; --hp-bg: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; max-width: 100vw; overflow-x: hidden; }
        
        .header-banner { width: 100%; padding: 15px; background: #a8e6cf linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%); border-radius: 20px; margin-bottom: 15px; text-align: center; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 1. 恢復動物表現總覽 */
        .perf-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 15px; background: white; border-radius: 15px; overflow: hidden; border: 2px solid #558b2f; }
        .perf-table th { background: #f0f4ef; padding: 8px; border-bottom: 2px solid #558b2f; }
        .perf-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #eee; }

        .summary-box { background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; border: 2px solid #e1e8e1; }
        .summary-box div span { font-size: 0.8rem; color: #888; display: block; }

        .dino-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 15px; }
        
        .dino-card { position: relative; background: white; border-radius: 25px; padding: 15px; border: 3px solid var(--p); box-shadow: 0 6px 15px rgba(0,0,0,0.08); overflow: hidden; }
        .card-bg-icon { position: absolute; font-size: 150px; color: rgba(0,0,0,0.03); right: -30px; bottom: -30px; transform: rotate(-15deg); pointer-events: none; }

        .editable-title { width: 100%; border: none; background: transparent; text-align: center; font-size: 1.4rem; font-weight: bold; color: var(--p); border-bottom: 1px dashed #ccc; margin-bottom: 10px; position: relative; z-index: 1; }
        
        /* 血條區 */
        .hp-container { width: 180px; height: 16px; background: var(--hp-bg); margin: 0 auto 10px; border-radius: 10px; border: 2px solid #999; overflow: hidden; position: relative; z-index: 1; }
        .hp-bar { height: 100%; background: linear-gradient(to right, #ffeb3b, #4caf50); width: 0%; transition: width 0.6s ease; }
        .hp-marker { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 14px; top: 0; left: 0; pointer-events: none; }

        .calc-area { background: #fffde7; padding: 10px; border-radius: 12px; margin-bottom: 12px; font-size: 0.9rem; position: relative; z-index: 1; }
        .calc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        
        .input-row { display: grid; grid-template-columns: 1.2fr 0.6fr 1.8fr; gap: 5px; margin-bottom: 10px; position: relative; z-index: 1; }
        .input-row input { padding: 8px 4px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem; width: 100%; }
        
        button { width: 100%; padding: 12px; border-radius: 15px; border: none; background: var(--p); color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; position: relative; z-index: 1; }

        /* 2. 餵食紀錄順序優化 */
        .log-list { margin-top: 10px; height: 150px; overflow-y: auto; font-size: 0.8rem; border-top: 1px solid #eee; position: relative; z-index: 1; }
        .log-list table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .log-list td { padding: 6px 2px; border-bottom: 1px solid #f9f9f9; text-align: center; word-break: break-all; }
        .log-label { font-size: 0.7rem; color: #999; }
    </style>
</head>
<body>

<div class="header-banner">
    <h1>五月動物園養殖</h1>
    <p id="status-msg" style="font-size:0.8rem; color:#666;">⌛ 正在讀取雲端數據...</p>
</div>

<table class="perf-table">
    <thead><tr><th>動物</th><th>總食量</th><th>飽食度</th><th>達成</th></tr></thead>
    <tbody id="performanceBody"></tbody>
</table>

<div class="summary-box">
    <div><span>🥩 總食量</span><b id="gRev" style="color: var(--accent);">$0</b></div>
    <div><span>💸 總支出</span><b id="gExp" style="color: #78909c;">$0</b></div>
    <div><span>💖 總飽食度</span><b id="gProfit" style="color: var(--p);">$0</b></div>
</div>

<div id="dinoContainer" class="dino-grid"></div>

<script>
// ⚠️ 使用你最新的 GAS 網址
const GAS_URL = "https://script.google.com/macros/s/AKfycbxpzlFOkwTEY6TiOybrPfQImTSTUd-KICltPBlTsUtTE96_7RpOPOhairXBB5lgPdQD2A/exec"; 

const defaultDinos = [
    { id: 0, icon: "Rex", name: "新竹巨城", taxRate: 33, rent: 9000, extraTax: 0 },
    { id: 1, icon: "Whale", name: "桃園新光", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 2, icon: "Owl", name: "板橋環球", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 3, icon: "Fish", name: "內湖三總", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 4, icon: "Dino", name: "日月光B1", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 5, icon: "Cow", name: "北榮", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 6, icon: "Lobster", name: "林口A9", taxRate: 33, rent: 0, extraTax: 0 },
    { id: 7, icon: "Rooster", name: "北投", taxRate: 33, rent: 0, extraTax: 0 }
];

let counters = JSON.parse(JSON.stringify(defaultDinos)).map(d => ({ ...d, logs: [] }));

function parseCloudDate(dateInput) {
    if (!dateInput) return "";
    let dStr = String(dateInput);
    if (dStr.includes('T')) return dStr.split('T')[0].slice(5);
    if (dStr.includes('/')) {
        let parts = dStr.split('/');
        if (parts.length >= 3) return `${parts[1].padStart(2, '0')}-${parts[2].split(' ')[0].padStart(2, '0')}`;
    }
    return dStr; 
}

async function fetchCloudData() {
    try {
        const response = await fetch(GAS_URL + "?action=read");
        const data = await response.json();
        counters.forEach(c => c.logs = []);
        data.forEach(row => {
            const dino = counters.find(d => d.name.trim() === String(row.name).trim());
            if (dino) {
                dino.logs.push({ date: parseCloudDate(row.date), qty: row.qty, amt: row.amt });
            }
        });
        document.getElementById('status-msg').innerText = "✅ 同步更新成功 (" + new Date().toLocaleTimeString() + ")";
        render();
    } catch (e) {
        document.getElementById('status-msg').innerText = "⚠️ 數據載入中...";
        render();
    }
}

function render() {
    const container = document.getElementById('dinoContainer');
    const perfBody = document.getElementById('performanceBody');
    container.innerHTML = ''; perfBody.innerHTML = '';
    let gRev = 0, gExp = 0, perfData = [];

    counters.forEach(c => {
        const rev = c.logs.reduce((s, l) => s + (Number(l.amt) || 0), 0);
        const qty = c.logs.reduce((s, l) => s + (Number(l.qty) || 0), 0);
        const cost = qty * 55.2;
        const tax = rev * (c.taxRate / 100);
        // 3. 補繳稅邏輯：飽食度扣除補繳稅
        const profit = rev - tax - cost - (c.rent || 0) - (c.extraTax || 0);

        gRev += rev; 
        gExp += (tax + cost + (c.rent || 0) + (c.extraTax || 0));

        const hpLimit = 80000;
        const hpPercent = Math.min(Math.max((profit / hpLimit) * 100, 0), 100);

        perfData.push({ icon: c.icon, name: c.name, rev, profit, hpPercent });

        const card = document.createElement('div');
        card.className = 'dino-card';
        card.innerHTML = `
            <div class="card-bg-icon">${c.icon === 'Rex' ? '🦖' : c.icon === 'Whale' ? '🐳' : c.icon === 'Owl' ? '🦉' : c.icon === 'Fish' ? '🐠' : c.icon === 'Dino' ? '🦕' : c.icon === 'Cow' ? '🐄' : c.icon === 'Lobster' ? '🦞' : '🐓'}</div>
            <input class="editable-title" type="text" value="${c.name}" onchange="update(${c.id}, 'name', this.value)">
            <div class="hp-container">
                <div class="hp-bar" style="width: ${hpPercent}%; ${hpPercent >= 100 ? 'background: #00e676;' : ''}"></div>
                <div class="hp-marker">${hpPercent >= 100 ? '👑 MAX' : '⭐'}</div>
            </div>
            <div class="calc-area">
                <div class="calc-row"><span>🥩 累積食量:</span><b>$${rev.toLocaleString()}</b></div>
                <div class="calc-row"><span>📦 成本:</span><b>$${cost.toFixed(0)}</b></div>
                <div class="calc-row"><span>👑 國王稅:</span><span>$${tax.toFixed(0)}</span></div>
                <div class="calc-row" style="color: #d32f2f;">
                    <span>💸 補繳稅:</span>
                    <input type="number" style="width:60px; border:none; border-bottom:1px solid #ccc; background:transparent; text-align:right;" value="${c.extraTax}" onchange="update(${c.id}, 'extraTax', this.value)">
                </div>
                <div class="calc-row" style="color:var(--p); font-weight:bold; border-top:1px dashed #ccc; padding-top:8px; margin-top:5px; font-size:1rem;">
                    <span>💖 飽食度:</span><span>$${profit.toLocaleString(undefined, {maximumFractionDigits:0})}</span>
                </div>
            </div>
            <div class="input-row">
                <input type="date" id="date-${c.id}" value="${new Date().toISOString().split('T')[0]}">
                <input type="number" id="qty-${c.id}" placeholder="只">
                <input type="number" id="amt-${c.id}" placeholder="金額" onkeypress="if(event.key==='Enter')addAndSync(${c.id})">
            </div>
            <button onclick="addAndSync(${c.id})">🍖 餵食同步</button>
            <div class="log-list">
                <table>
                    ${c.logs.map((l) => `
                        <tr>
                            <td width="35%">${l.date}</td>
                            <td width="25%">${l.qty}只</td>
                            <td width="40%">$${Number(l.amt).toLocaleString()}</td>
                        </tr>
                    `).reverse().join('')}
                </table>
            </div>
        `;
        container.appendChild(card);
    });

    perfData.sort((a,b) => b.profit - a.profit).forEach(p => {
        perfBody.innerHTML += `<tr>
            <td>${p.name}</td>
            <td>$${p.rev.toLocaleString()}</td>
            <td style="color:var(--p); font-weight:bold;">$${p.profit.toLocaleString(undefined, {maximumFractionDigits:0})}</td>
            <td>${p.hpPercent.toFixed(0)}%</td>
        </tr>`;
    });

    document.getElementById('gRev').innerText = '$' + gRev.toLocaleString();
    document.getElementById('gExp').innerText = '$' + gExp.toLocaleString(undefined, {maximumFractionDigits:0});
    document.getElementById('gProfit').innerText = '$' + (gRev - gExp).toLocaleString(undefined, {maximumFractionDigits:0});
    localStorage.setItem('zoo_v24_extratax', JSON.stringify(counters.map(c => ({id:c.id, et:c.extraTax}))));
}

// 載入暫存的補繳稅設定
const savedTax = JSON.parse(localStorage.getItem('zoo_v24_extratax'));
if(savedTax) savedTax.forEach(s => { const d = counters.find(c => c.id === s.id); if(d) d.extraTax = s.et; });

window.update = (id, f, v) => { counters[id][f] = (f==='name'?v:parseFloat(v)||0); render(); };

async function addAndSync(id) {
    const q = document.getElementById(`qty-${id}`), a = document.getElementById(`amt-${id}`), d = document.getElementById(`date-${id}`);
    if (a.value === "") return alert("請輸入金額");
    const log = { date: d.value.slice(5), amt: parseFloat(a.value) || 0, qty: parseInt(q.value) || 0 };
    const sData = { ...log, name: counters[id].name, fullDate: d.value };
    document.getElementById('status-msg').innerText = "⏳ 數據同步中...";
    try {
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(sData) });
        q.value = ''; a.value = '';
        setTimeout(fetchCloudData, 1500); // 延遲抓取確保 GAS 已處理完畢
    } catch (e) { alert("同步失敗"); }
}

fetchCloudData();
// 每 5 分鐘自動刷新一次雲端數據
setInterval(fetchCloudData, 300000);
</script>
</body>
</html>
